# release.yml — 自动发布流水线：推送 v*.*.* 版本 tag → 构建（Linux + Windows → 发布 GitHub Release
#
# 与本地自动打包流程 build-tag.sh 对齐：
#   1. 版本预检（tag 必须等于 v + package.json 的 version，不一致立即失败）
#   2. lint:pack（bpmnlint 规则打包）→ vite build（Web 产物 dist/）
#   3. 渲染冒烟测试（Node + jsdom，44 项断言，无需浏览器）
#   4. electron-builder 打包：Linux 在 ubuntu runner（AppImage/deb/tar.gz），
#      Windows 在 windows runner（nsis/zip）— 各平台原生构建，无需 wine
#   5. 汇总产物，以当前 tag 创建 GitHub Release：上传 Web 静态包 + 全部安装包，
#      更新说明取自上/下两个版本 tag 之间的提交记录
#
# 触发方式:
#   git tag v0.1.6 && git push origin v0.1.6
#
# 前置要求:
#   • 仓库 Settings → Actions → General → Workflow permissions 必须设为
#     "Read and write permissions"（GITHUB_TOKEN 需要写权限创建 Release）
#   • tag 格式: v<major>.<minor>.<patch>（如 v0.1.6），并与 package.json 的
#     version 字段一致（流水线第一步会校验）
#
# 说明: 平台拆分为并行 job（ubuntu / windows），各自构建后由 release job
# 统一发布 — 这是 electron-builder 官方推荐的 GitHub Actions 形态。

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write          # 创建 Release 并上传产物

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════════
  # Linux 构建（ubuntu 原生 runner）
  # ══════════════════════════════════════════════════════════════════
  build-linux:
    name: Build — Linux
    runs-on: ubuntu-latest
    steps:
      # 检出 tag（完整历史，release job 生成更新说明需要）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 22（vite 8 要求 ^20.19.0 || >=22.12.0）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── 版本提取与预检（与 package.json 不一致立即失败）────────────
      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_VER="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$PKG_VER" ]]; then
            echo "::error::tag '$TAG' 与 package.json version '$PKG_VER' 不一致；请先在 package.json 中提升版本号再打 tag"
            exit 1
          fi
          echo "OK: tag=$TAG version=$PKG_VER"

      # ── 缓存 electron / electron-builder 工具链（M15：必须在 npm ci 之前恢复，
      # 否则 npm postinstall 下载 electron 时缓存尚未就位，永不命中）─────
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # ── 安装依赖 ──────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── JS 静态检查（阻塞；npm run build 内部也已包含）──────────────
      - name: Lint JS
        run: npm run lint:js

      # ── 构建 Web 产物：lint:pack → vite build（对应本地 npm run build）
      - name: Build web bundle
        run: npm run build

      # ── 渲染冒烟测试（纯 BPMN / Camunda 7 / Camunda 8 / DMN，44 项）
      - name: Smoke test
        run: npm run test:smoke

      # ── Electron 打包：Linux（AppImage, deb, tar.gz）──────────────
      # --publish never：不在 electron-builder 内发布，统一由 release job
      # 的 Create GitHub Release 步骤发布（与 build-tag.sh 的 --publish never 一致）
      - name: Package Electron — Linux
        run: npx electron-builder --linux --publish never

      # ── 收集 Web 静态产物为 zip 资产（含 package.json，对应本地 web/ 目录）
      - name: Package web asset
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          mkdir -p .web-asset
          cp -r dist/* .web-asset/
          cp package.json .web-asset/
          (cd .web-asset && zip -rq "../release/bpmn-studio-${VER#v}-web.zip" .)
          rm -rf .web-asset

      # ── 上传产物（Linux 安装包 + Web 静态包）───────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*-web.zip
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════════
  # Windows 构建（windows 原生 runner，无需 wine）
  # ══════════════════════════════════════════════════════════════════
  build-win:
    name: Build — Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_VER="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$PKG_VER" ]]; then
            echo "::error::tag '$TAG' 与 package.json version '$PKG_VER' 不一致；请先在 package.json 中提升版本号再打 tag"
            exit 1
          fi
          echo "OK: tag=$TAG version=$PKG_VER"
        shell: bash

      # ── 缓存 electron / electron-builder 工具链（M15：npm ci 之前恢复）─────
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Windows 侧同样需要 dist/（vite build 前先 lint:pack）
      - name: Build web bundle
        run: npm run build

      # ── Electron 打包：Windows（nsis, zip）────────────────────────
      - name: Package Electron — Windows
        run: npx electron-builder --win --publish never

      # ── 上传产物（NSIS exe + 便携 zip）────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════════
  # 发布（汇总两个平台的产物 → 创建 GitHub Release）
  # ══════════════════════════════════════════════════════════════════
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-win]
    permissions:
      contents: write
    steps:
      # 完整历史：更新说明需要对比上一个版本 tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 合并且平铺两个平台的产物到 release-assets/
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      # ── 生成更新说明：当前 tag 与上一版本 tag 之间的提交记录 ────────
      - name: Generate release notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [[ -n "$PREV" ]]; then
            RANGE="$PREV..$TAG"
            echo "comparing $PREV → $TAG"
          else
            RANGE="$TAG"
            echo "第一个版本，列出 $TAG 迄止的全部提交"
          fi
          COUNT="$(git rev-list --count "$RANGE")"
          {
            echo "## What's Changed"
            echo ""
            git log --no-merges --pretty=format:"- %h %s" "$RANGE"
            echo ""
            echo ""
            echo "---"
            echo "_${COUNT} 个提交_"
          } > RELEASE-NOTES.md
          echo "path=RELEASE-NOTES.md" >> "$GITHUB_OUTPUT"

      # ── 创建 GitHub Release 并上传全部产物 ─────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BPMN Studio ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}