# release.yml — triggered by a pushed version tag (e.g. v0.1.3)
#
# 1.  Builds the Vite web bundle
# 2.  Packages Electron apps for Linux + Windows via electron-builder
# 3.  Creates a GitHub Release with all artifacts attached
#
# Prerequisites:
#   • Tag must match v*.*.* (e.g. v0.1.3)
#   • Repository Settings → Actions → General → "Read and write permissions"
#     must be enabled (so GITHUB_TOKEN can create the release)

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write          # needed to create the release & upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # ── checkout ──────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── node ──────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── install dependencies ──────────────────────────────────────────
      - run: npm ci

      # ── build web bundle (dist/) ──────────────────────────────────────
      - run: npm run build

      # ── package Electron — Linux ──────────────────────────────────────
      - name: Electron build — Linux
        run: npx electron-builder --linux --publish never

      # ── package Electron — Windows ────────────────────────────────────
      - name: Electron build — Windows
        run: npx electron-builder --win --publish never

      # ── extract version from tag ─────────────────────────────────────
      - name: Set version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # ── create GitHub Release & upload assets ────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BPMN Studio ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.exe
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
